<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/field-reports-web/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Electric Technology — تقارير خدمة وحدات التبريد">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iPhone: "Add to Home Screen" opens it like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ET Service">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#0D47A1">

  <title>ET Service — Electric Technology</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; color: #0D47A1; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #dde6f5; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #0D47A1;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(260%); } to { transform: translateX(-100%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>Electric Technology</div>
    <div class="bar"></div>
  </div>
  <script>
    // Offline support: keeps a copy of the app so it opens without internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('app_sw.js').catch(function () {});
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
